# Safe Seminar Simulation Scenario Data (100% Mock / Zero Network Activity)
scenario_name: "MegaCorp Authorized CTF Lab"
domain: "LAB.ENTERPRISE.THM"

targets:
  - ip: "10.10.10.10"
    hostname: "LAB-DC"
    os: "Windows Server 2019"
    build: "17763"
    architecture: "x64"
    domain: "LAB.ENTERPRISE.THM"
    role: "Domain Controller"
    protocol: "smb"
    port: 445
    smb_version: "SMB 3.1.1"
    smb_dialect: "SMB 3.1.1"
