    port: 389
    default_naming_context: "DC=lab,DC=enterprise,DC=thm"
    supported_sasl_mechanisms: ["GSS-SPNEGO", "GSSAPI", "NTLM", "DIGEST-MD5"]
    tls_status: "TLS Available (Port 636 / StartTLS)"
