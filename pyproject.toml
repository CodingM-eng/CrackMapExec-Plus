[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crackmapexec-plus"
version = "0.1.0"
description = "CrackMapExec+ — Next-generation security lab and educational testing framework"
readme = "README.md"
authors = [
    { name = "CrackMapExec+ Team" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "pentest", "education", "lab", "smb", "ldap", "winrm", "ssh", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
"crackmapexec+" = "cmeplus.cli.parser:main"
"cme+" = "cmeplus.cli.parser:main"
"crackmapexec-plus" = "cmeplus.cli.parser:main"
"cme-plus" = "cmeplus.cli.parser:main"
"crackmapexecplus" = "cmeplus.cli.parser:main"
"cmeplus" = "cmeplus.cli.parser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cmeplus.video" = ["*.yaml"]
"cmeplus.config" = ["*.yaml"]
"cmeplus.demo" = ["scenarios/*.yaml", "scenarios/*.json"]
"cmeplus.reports" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
